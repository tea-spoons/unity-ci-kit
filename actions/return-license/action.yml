name: Return Unity license
description: Return the license seat (or remove the .ulf file) activated by `activate-license`. Run it with `if: always()`.

inputs:
  license-mode:
    description: "`personal` or `serial` (return the seat) or `ulf` (remove the license file)."
    required: true
  unity-path:
    description: Path or command of the Unity editor executable on the runner.
    required: false
    default: unity-editor
  licensing-client:
    description: >-
      Path of Unity.Licensing.Client (inside the editor at Data/Resources/Licensing/Client/). Set it for
      license-mode=personal on current editors so the client requests the Personal seat.
    required: false
  unity-email:
    description: Unity account email (license-mode=personal or serial).
    required: false
  unity-password:
    description: Unity account password (license-mode=personal or serial).
    required: false

runs:
  using: composite
  steps:
    - name: Return license
      shell: bash
      env:
        LICENSE_MODE: ${{ inputs.license-mode }}
        UNITY_PATH: ${{ inputs.unity-path }}
        LICENSING_CLIENT: ${{ inputs.licensing-client }}
        UNITY_EMAIL: ${{ inputs.unity-email }}
        UNITY_PASSWORD: ${{ inputs.unity-password }}
      run: bash "${{ github.action_path }}/../../scripts/license.sh" return
