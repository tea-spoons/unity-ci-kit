name: Publish Unity package
description: >-
  Validate a UPM package, tag the current commit and create a GitHub release with a package tarball.
  The calling job needs `permissions: contents: write` and a checkout of the repository.

inputs:
  package-path:
    description: Path of the package folder (the one containing package.json), relative to the workspace.
    required: true
  tag-format:
    description: Tag template. `{name}` and `{version}` are replaced. Use `{name}-v{version}` for repos with several packages.
    required: false
    default: "v{version}"
  github-token:
    description: Token used to create the release.
    required: false
    default: ${{ github.token }}
  dry-run:
    description: Validate and report what would be published without creating a tag or release.
    required: false
    default: "false"
  index-path:
    description: If set, also write index.json / index.html for the package into this directory (for GitHub Pages).
    required: false

outputs:
  tag:
    description: The tag that was (or would be) created.
    value: ${{ steps.publish.outputs.tag }}
  install-url:
    description: Package Manager git URL for the published tag.
    value: ${{ steps.publish.outputs.install-url }}
  tarball:
    description: Path of the generated package tarball.
    value: ${{ steps.publish.outputs.tarball }}

runs:
  using: composite
  steps:
    - name: Publish
      id: publish
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
        TAG_FORMAT: ${{ inputs.tag-format }}
        GH_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '0' }}
      run: bash "${{ github.action_path }}/../../scripts/publish-package.sh" "$PACKAGE_PATH"

    - name: Generate index
      if: inputs.index-path != ''
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
        INDEX_PATH: ${{ inputs.index-path }}
        REF: ${{ steps.publish.outputs.tag }}
      run: bash "${{ github.action_path }}/../../scripts/generate-index.sh" "$INDEX_PATH" "$PACKAGE_PATH"
