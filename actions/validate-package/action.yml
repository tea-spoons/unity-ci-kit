name: Validate Unity package
description: Check package.json fields, .meta coverage and GUID uniqueness of a UPM package.

inputs:
  package-path:
    description: Path of the package folder (the one containing package.json), relative to the workspace.
    required: true

outputs:
  name:
    description: Package name from package.json.
    value: ${{ steps.info.outputs.name }}
  version:
    description: Package version from package.json.
    value: ${{ steps.info.outputs.version }}

runs:
  using: composite
  steps:
    - name: Validate
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: bash "${{ github.action_path }}/../../scripts/validate-package.sh" "$PACKAGE_PATH"

    - name: Read package info
      id: info
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        echo "name=$(jq -r .name "${PACKAGE_PATH}/package.json")" >> "$GITHUB_OUTPUT"
        echo "version=$(jq -r .version "${PACKAGE_PATH}/package.json")" >> "$GITHUB_OUTPUT"
