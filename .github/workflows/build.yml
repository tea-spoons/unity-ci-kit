name: Unity build (reusable)

# Call from your own repo:
#   jobs:
#     build:
#       uses: tea-spoons/unity-ci-kit/.github/workflows/build.yml@v0
#       with:
#         unity-version: 6000.0.84f1
#         build-targets: '["StandaloneLinux64","StandaloneWindows64"]'
#       secrets: inherit
#
# The project needs the com.tea-spoons.ci-kit package, or pass your own `execute-method`.

on:
  workflow_call:
    inputs:
      unity-version:
        description: Editor version, e.g. 6000.0.84f1.
        type: string
        required: true
      build-targets:
        description: JSON array of Unity BuildTarget names, one job per target.
        type: string
        default: '["StandaloneLinux64"]'
      project-path:
        type: string
        default: "."
      version:
        description: PlayerSettings.bundleVersion to build with.
        type: string
        default: ""
      build-number:
        description: Android versionCode / iOS and macOS build number.
        type: string
        default: ""
      development:
        type: boolean
        default: false
      execute-method:
        type: string
        default: TeaSpoons.CiKit.BuildRunner.Build
      license-mode:
        description: personal, serial, ulf (older editors) or none.
        type: string
        default: personal
      image-version:
        type: string
        default: "3"
      cache-library:
        type: boolean
        default: true
      lfs:
        type: boolean
        default: false
      runs-on:
        type: string
        default: ubuntu-latest
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_SERIAL:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.build-targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.lfs }}

      - name: Cache Library
        if: inputs.cache-library
        uses: actions/cache@v4
        with:
          path: ${{ inputs.project-path }}/Library
          key: Library-${{ matrix.target }}-${{ inputs.unity-version }}-${{ hashFiles(format('{0}/Packages/manifest.json', inputs.project-path), format('{0}/ProjectSettings/ProjectVersion.txt', inputs.project-path)) }}
          restore-keys: |
            Library-${{ matrix.target }}-${{ inputs.unity-version }}-

      - uses: tea-spoons/unity-ci-kit/actions/build-player@v0
        with:
          unity-version: ${{ inputs.unity-version }}
          build-target: ${{ matrix.target }}
          project-path: ${{ inputs.project-path }}
          version: ${{ inputs.version }}
          build-number: ${{ inputs.build-number }}
          development: ${{ inputs.development }}
          execute-method: ${{ inputs.execute-method }}
          image-version: ${{ inputs.image-version }}
          license-mode: ${{ inputs.license-mode }}
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-serial: ${{ secrets.UNITY_SERIAL }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
