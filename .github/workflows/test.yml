name: Unity tests (reusable)

# Call from your own repo:
#   jobs:
#     test:
#       uses: tea-spoons/unity-ci-kit/.github/workflows/test.yml@v0
#       with:
#         unity-version: 6000.0.84f1
#       secrets: inherit

on:
  workflow_call:
    inputs:
      unity-version:
        description: Editor version, e.g. 6000.0.84f1.
        type: string
        required: true
      project-path:
        type: string
        default: "."
      test-mode:
        description: editmode, playmode or all.
        type: string
        default: editmode
      license-mode:
        description: personal, serial, ulf (older editors) or none.
        type: string
        default: personal
      component:
        type: string
        default: base
      image-version:
        type: string
        default: "3"
      cache-library:
        description: Cache the Library folder between runs.
        type: boolean
        default: true
      lfs:
        description: Fetch Git LFS files on checkout.
        type: boolean
        default: false
      runs-on:
        type: string
        default: ubuntu-latest
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_SERIAL:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.lfs }}

      - name: Cache Library
        if: inputs.cache-library
        uses: actions/cache@v4
        with:
          path: ${{ inputs.project-path }}/Library
          key: Library-test-${{ inputs.unity-version }}-${{ hashFiles(format('{0}/Packages/manifest.json', inputs.project-path), format('{0}/ProjectSettings/ProjectVersion.txt', inputs.project-path)) }}
          restore-keys: |
            Library-test-${{ inputs.unity-version }}-

      - uses: tea-spoons/unity-ci-kit/actions/run-tests@v0
        with:
          unity-version: ${{ inputs.unity-version }}
          project-path: ${{ inputs.project-path }}
          test-mode: ${{ inputs.test-mode }}
          component: ${{ inputs.component }}
          image-version: ${{ inputs.image-version }}
          license-mode: ${{ inputs.license-mode }}
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-serial: ${{ secrets.UNITY_SERIAL }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
